<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Complaints</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f5; margin: 0; padding: 20px 15px; }
    .wrap { max-width: 600px; margin: 0 auto; }
    h1 { color: #1a5c3a; text-align: center; }
    .back { display: inline-block; margin-bottom: 15px; color: #1a5c3a; font-weight: bold; text-decoration: none; }
    .item { background: white; border-radius: 12px; padding: 14px; margin-bottom: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
    .item img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 8px; }
    .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; color: white; margin: 10px 0 6px; }
    .Reported { background: #c0392b; }
    .Seen { background: #d68910; }
    .In-progress { background: #2471a3; }
    .Fixed { background: #1a5c3a; }
    .meta { color: #666; font-size: 14px; margin: 4px 0; }
    .adminNote { background: #eef5f0; border-left: 4px solid #1a5c3a; padding: 8px 10px; margin-top: 8px; font-size: 14px; }
    #empty { text-align: center; color: #555; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/home">&larr; Back to Home</a>
    <h1>My complaints</h1>
    <p id="empty">Loading...</p>
    <div id="list"></div>
  </div>

  <script>
    async function start() {
      const meResponse = await fetch("/api/me");
      const me = await meResponse.json();
      if (!me.loggedIn) {
        window.location.href = "/login";
        return;
      }

      const response = await fetch("/api/my-reports");
      if (!response.ok) {
        document.getElementById("empty").textContent = "Could not load your complaints.";
        return;
      }
      const reports = await response.json();

      const empty = document.getElementById("empty");
      const list = document.getElementById("list");

      if (reports.length === 0) {
        empty.textContent = "You have not reported anything yet.";
        return;
      }
      empty.style.display = "none";

      reports.forEach(function (r) {
        const item = document.createElement("div");
        item.className = "item";

        const img = document.createElement("img");
        img.src = "/uploads/" + encodeURIComponent(r.photo);
        img.alt = "Reported footpath";
        item.appendChild(img);

        const status = document.createElement("span");
        status.className = "status " + r.status.replace(" ", "-");
        status.textContent = r.status;
        item.appendChild(status);

        if (r.notes) {
          const notes = document.createElement("p");
          notes.textContent = r.notes;
          item.appendChild(notes);
        }

        const when = document.createElement("p");
        when.className = "meta";
        when.textContent = "Reported: " +
          new Date(r.created_at.replace(" ", "T") + "Z").toLocaleString();
        item.appendChild(when);

        const where = document.createElement("p");
        where.className = "meta";
        where.textContent = "Location: " + r.latitude.toFixed(5) + ", " + r.longitude.toFixed(5);
        item.appendChild(where);

        if (r.admin_note) {
          const note = document.createElement("div");
          note.className = "adminNote";
          note.textContent = "Official note: " + r.admin_note;
          item.appendChild(note);
        }

        list.appendChild(item);
      });
    }

    start();
  </script>
</body>
</html>
