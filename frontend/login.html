<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Footpath Reporter - Login</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, sans-serif; }

    /* ---------- The scene (sky, buildings, footpath, road) ---------- */
    .scene {
      position: fixed; inset: 0; overflow: hidden; z-index: 0;
      background: linear-gradient(#8fd3ff 0%, #d9f2ff 55%, #fff3d6 100%);
    }
    .sun {
      position: absolute; top: 6vh; right: 8vw; width: 90px; height: 90px;
      border-radius: 50%; background: #ffd54a;
      box-shadow: 0 0 60px 20px rgba(255, 213, 74, 0.6);
    }
    .cloud {
      position: absolute; left: 0; width: 140px; height: 40px;
      background: #fff; border-radius: 40px; opacity: 0.9;
      animation: drift linear infinite;
    }
    .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
    .cloud::before { width: 60px; height: 60px; top: -30px; left: 20px; }
    .cloud::after { width: 45px; height: 45px; top: -20px; left: 70px; }
    @keyframes drift {
      from { transform: translateX(-200px); }
      to { transform: translateX(calc(100vw + 200px)); }
    }
    .skyline { position: absolute; left: 0; bottom: 28vh; width: 100%; height: 26vh; }
    .pavement {
      position: absolute; left: 0; right: 0; bottom: 8vh; height: 20vh;
      background:
        repeating-linear-gradient(90deg, transparent 0 78px, rgba(0, 0, 0, 0.08) 78px 80px),
        #d8d2c6;
      border-top: 6px solid #bdb6a8;
    }
    .kerb { position: absolute; left: 0; right: 0; bottom: 8vh; height: 8px; background: #9a9486; }
    .road { position: absolute; left: 0; right: 0; bottom: 0; height: 8vh; background: #4a4f57; }
    .road::after {
      content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px;
      background: repeating-linear-gradient(90deg, #f3e9a0 0 40px, transparent 40px 80px);
    }

    /* ---------- The walking people ---------- */
    .walker {
      position: absolute; left: 0;
      animation-timing-function: linear; animation-iteration-count: infinite;
    }
    .lane-back { bottom: 20vh; }
    .lane-front { bottom: 10vh; }
    .people { --h: clamp(80px, 15vh, 130px); display: flex; align-items: flex-end; gap: 4px; }
    .lane-back .people { --h: clamp(64px, 12vh, 104px); }
    .people svg { height: var(--h); width: calc(var(--h) / 2); }
    .people svg.young { height: calc(var(--h) * 0.88); width: calc(var(--h) * 0.44); }
    .people.flip svg { transform: scaleX(-1); }
    @keyframes walk-ltr {
      from { transform: translateX(-260px); }
      to { transform: translateX(calc(100vw + 60px)); }
    }
    @keyframes walk-rtl {
      from { transform: translateX(calc(100vw + 60px)); }
      to { transform: translateX(-260px); }
    }
    .leg, .arm {
      transform-box: fill-box; transform-origin: 50% 0%;
      animation: swing var(--dur, 0.95s) ease-in-out infinite alternate;
    }
    .leg.b, .arm.a { animation-direction: alternate-reverse; }
    @keyframes swing {
      from { transform: rotate(-24deg); }
      to { transform: rotate(24deg); }
    }

    /* ---------- The login card ---------- */
    .wrap {
      position: relative; z-index: 1; min-height: 100vh;
      display: flex; justify-content: center; align-items: flex-start;
      padding: 4vh 14px 40vh;
    }
    .card {
      width: 100%; max-width: 380px; padding: 22px;
      background: rgba(255, 255, 255, 0.93); border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }
    .card h1 { margin: 0; color: #1a5c3a; font-size: 26px; text-align: center; }
    .tag { margin: 6px 0 16px; text-align: center; color: #555; font-size: 14px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tab {
      flex: 1; padding: 10px; border: 2px solid #1a5c3a; background: white;
      color: #1a5c3a; border-radius: 8px; font-size: 15px; cursor: pointer;
    }
    .tab.active { background: #1a5c3a; color: white; }
    .roles { display: flex; gap: 16px; margin-bottom: 12px; font-size: 14px; }
    .card input[type=text], .card input[type=email], .card input[type=password] {
      display: block; width: 100%; padding: 11px; margin-bottom: 10px;
      border: 1px solid #bbb; border-radius: 8px; font-size: 16px;
    }
    .submit {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #1a5c3a; color: white; font-size: 17px; cursor: pointer;
    }
    .submit:hover { background: #14472d; }
    .msg { min-height: 20px; margin: 10px 0 0; text-align: center; font-size: 14px; color: #1a5c3a; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="scene">
    <div class="sun"></div>
    <div class="cloud" style="top: 9vh; animation-duration: 90s; animation-delay: -20s"></div>
    <div class="cloud" style="top: 20vh; animation-duration: 120s; animation-delay: -70s"></div>
    <div class="cloud" style="top: 14vh; animation-duration: 150s; animation-delay: -110s"></div>

    <svg class="skyline" viewBox="0 0 1200 220" preserveAspectRatio="xMidYMax slice">
      <g fill="#b7c4d4">
        <rect x="20" y="90" width="110" height="130"/>
        <rect x="260" y="60" width="90" height="160"/>
        <rect x="560" y="100" width="120" height="120"/>
        <rect x="860" y="70" width="100" height="150"/>
        <rect x="1080" y="110" width="90" height="110"/>
      </g>
      <g fill="#9fb0c4">
        <rect x="140" y="120" width="100" height="100"/>
        <rect x="380" y="85" width="110" height="135"/>
        <rect x="700" y="55" width="130" height="165"/>
        <rect x="980" y="100" width="80" height="120"/>
      </g>
      <g fill="#fff" opacity="0.6">
        <rect x="40" y="110" width="14" height="18"/><rect x="70" y="110" width="14" height="18"/>
        <rect x="280" y="85" width="14" height="18"/><rect x="310" y="85" width="14" height="18"/>
        <rect x="720" y="80" width="14" height="18"/><rect x="760" y="80" width="14" height="18"/>
        <rect x="880" y="95" width="14" height="18"/><rect x="580" y="120" width="14" height="18"/>
      </g>
      <g>
        <rect x="246" y="170" width="8" height="50" fill="#7a5a3a"/><circle cx="250" cy="160" r="30" fill="#4caf6a"/>
        <rect x="536" y="175" width="8" height="45" fill="#7a5a3a"/><circle cx="540" cy="165" r="26" fill="#58b975"/>
        <rect x="836" y="170" width="8" height="50" fill="#7a5a3a"/><circle cx="840" cy="160" r="30" fill="#4caf6a"/>
        <rect x="1056" y="175" width="8" height="45" fill="#7a5a3a"/><circle cx="1060" cy="165" r="26" fill="#58b975"/>
      </g>
    </svg>

    <div class="pavement"></div>
    <div class="kerb"></div>
    <div class="road"></div>

    <div id="walkers"></div>
  </div>

  <main class="wrap">
    <section class="card">
      <h1>Footpath Reporter</h1>
      <p class="tag">Report broken footpaths. Help our city walk safely.</p>

      <div class="tabs">
        <button type="button" id="tabIn" class="tab active">Sign in</button>
        <button type="button" id="tabUp" class="tab">Sign up</button>
      </div>

      <div id="rolesBox" class="roles hidden">
        <label><input type="radio" name="role" value="user" checked> Citizen</label>
        <label><input type="radio" name="role" value="admin"> Official (Admin)</label>
      </div>

      <form id="authForm">
        <input id="nameBox" class="hidden" type="text" placeholder="Full name" autocomplete="name">
        <input id="email" type="email" placeholder="Email" autocomplete="email" required>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <input id="adminBox" class="hidden" type="password" placeholder="Official access code">
        <button type="submit" id="submitBtn" class="submit">Sign in</button>
      </form>
      <p id="msg" class="msg"></p>
    </section>
  </main>

  <script>
    // ---------- Draw one person ----------
    const SKIN = ["#f1c9a5", "#d9a77c", "#b9805a", "#8d5a3c"];

    function person(o) {
      const dur = o.old ? "1.4s" : o.fast ? "0.6s" : "0.95s";
      const legColor = o.dress ? o.skin : o.pants;
      const body = o.dress
        ? `<path d="M18 32 h24 l9 54 h-42 z" fill="${o.shirt}"/>`
        : `<rect x="18" y="30" width="24" height="42" rx="10" fill="${o.shirt}"/>`;
      const cane = o.old ? `<rect x="51" y="66" width="3" height="52" rx="1.5" fill="#6b4a2f"/>` : "";
      const bun = o.bun ? `<circle cx="30" cy="5" r="5" fill="${o.hair}"/>` : "";
      const leg = (cls, x) =>
        `<g class="leg ${cls}"><rect x="${x}" y="68" width="10" height="44" rx="5" fill="${legColor}"/>` +
        `<ellipse cx="${x + 5}" cy="113" rx="8" ry="4" fill="#333"/></g>`;
      const arm = (cls, x) =>
        `<g class="arm ${cls}"><rect x="${x}" y="32" width="9" height="34" rx="4.5" fill="${o.shirt}"/>` +
        `<circle cx="${x + 4.5}" cy="68" r="4.5" fill="${o.skin}"/></g>`;

      return `<svg class="${o.young ? "young" : ""}" viewBox="0 0 60 120" style="--dur:${dur}">
        ${arm("b", 41)}${leg("b", 31)}
        ${body}
        ${leg("a", 19)}${arm("a", 10)}
        ${cane}${bun}
        <circle cx="30" cy="18" r="11" fill="${o.skin}"/>
        <path d="M19 17 a11 11 0 0 1 22 0 z" fill="${o.hair}"/>
        <circle cx="26" cy="19" r="1.3" fill="#333"/><circle cx="34" cy="19" r="1.3" fill="#333"/>
      </svg>`;
    }

    // ---------- Who walks on the footpath ----------
    const walkers = [
      // two old people
      { dir: "ltr", lane: "back", secs: 50, delay: -12,
        people: [{ old: true, skin: SKIN[0], hair: "#dcdcdc", shirt: "#7a8fa6", pants: "#55566a" }] },
      { dir: "rtl", lane: "front", secs: 56, delay: -34,
        people: [{ old: true, dress: true, bun: true, skin: SKIN[1], hair: "#e6e6e6", shirt: "#9b6b9e" }] },
      // two young people
      { dir: "ltr", lane: "front", secs: 24, delay: -6,
        people: [{ young: true, fast: true, skin: SKIN[2], hair: "#2b2118", shirt: "#ffc83d", pants: "#2f5d9e" }] },
      { dir: "rtl", lane: "back", secs: 28, delay: -18,
        people: [{ young: true, fast: true, dress: true, skin: SKIN[0], hair: "#4a2c17", shirt: "#ff7aa8" }] },
      // two couples
      { dir: "ltr", lane: "front", secs: 36, delay: -22,
        people: [
          { skin: SKIN[1], hair: "#222", shirt: "#2a7de1", pants: "#333a4d" },
          { dress: true, skin: SKIN[1], hair: "#3b2418", shirt: "#e0453a" }
        ] },
      { dir: "rtl", lane: "back", secs: 42, delay: -3,
        people: [
          { skin: SKIN[3], hair: "#111", shirt: "#2e9e6b", pants: "#3b3b3b" },
          { dress: true, skin: SKIN[3], hair: "#111", shirt: "#7d4fd6" }
        ] }
    ];

    const holder = document.getElementById("walkers");
    walkers.forEach(function (w) {
      const div = document.createElement("div");
      div.className = "walker lane-" + w.lane;
      div.style.animationName = "walk-" + w.dir;
      div.style.animationDuration = w.secs + "s";
      div.style.animationDelay = w.delay + "s";

      const inner = document.createElement("div");
      inner.className = "people" + (w.dir === "rtl" ? " flip" : "");
      inner.innerHTML = w.people.map(person).join("");

      div.appendChild(inner);
      holder.appendChild(div);
    });

    // ---------- Sign in / Sign up switching ----------
    let mode = "in";
    const tabIn = document.getElementById("tabIn");
    const tabUp = document.getElementById("tabUp");
    const rolesBox = document.getElementById("rolesBox");
    const nameBox = document.getElementById("nameBox");
    const adminBox = document.getElementById("adminBox");
    const submitBtn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    function chosenRole() {
      return document.querySelector('input[name="role"]:checked').value;
    }

    function refresh() {
      tabIn.classList.toggle("active", mode === "in");
      tabUp.classList.toggle("active", mode === "up");
      rolesBox.classList.toggle("hidden", mode !== "up");
      nameBox.classList.toggle("hidden", mode !== "up");
      adminBox.classList.toggle("hidden", !(mode === "up" && chosenRole() === "admin"));
      submitBtn.textContent = mode === "in" ? "Sign in" : "Create account";
      msg.textContent = "";
    }

    tabIn.addEventListener("click", function () { mode = "in"; refresh(); });
    tabUp.addEventListener("click", function () { mode = "up"; refresh(); });
    document.querySelectorAll('input[name="role"]').forEach(function (r) {
      r.addEventListener("change", refresh);
    });

       document.getElementById("authForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      msg.textContent = "Please wait...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        if (mode === "in") {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, password: password })
          });
          const data = await response.json();

          if (response.ok) {
            window.location.href = "/home";
          } else {
            msg.textContent = data.message;
          }
        } else {
          const response = await fetch("/api/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: nameBox.value,
              email: email,
              password: password,
              role: chosenRole(),
              adminCode: adminBox.value
            })
          });
          const data = await response.json();

          if (response.ok) {
            mode = "in";
            refresh();
            document.getElementById("password").value = "";
            adminBox.value = "";
          }
          msg.textContent = data.message;
        }
      } catch (error) {
        msg.textContent = "Could not reach the server. Please try again.";
      }
    });

    refresh();
  </script>

</body>
</html>
