<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Footpath Reporter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 0 15px;
      background: #f4f7f5;
    }
    h1 {
      color: #1a5c3a;
      font-size: 26px;
    }
    button {
      background: #1a5c3a;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #14472d;
    }
    textarea {
      width: 100%;
      height: 90px;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
      border: 1px solid #bbb;
      border-radius: 8px;
    }
    #locationText, #statusText {
      font-weight: bold;
      color: #1a5c3a;
    }
  </style>
</head>
<body>

  <h1>Report a damaged or missing footpath</h1>
  <p>Help make Bengaluru's streets safe to walk.</p>

  <p>Take a photo of the footpath:</p>
  <input type="file" id="photo" accept="image/*" capture="environment">

  <p>Describe the problem:</p>
  <textarea id="notes" placeholder="Example: Footpath is broken near the bus stop"></textarea>

  <br><br>
  <button id="locBtn">Get my location</button>
  <button id="submitBtn">Submit report</button>

  <p id="locationText"></p>
  <p id="statusText"></p>

  <script>
    let latitude = null;
    let longitude = null;

    // Location button
    document.getElementById("locBtn").addEventListener("click", function () {
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          latitude = pos.coords.latitude;
          longitude = pos.coords.longitude;
          document.getElementById("locationText").textContent =
            "Latitude: " + latitude + " | Longitude: " + longitude;
        },
        function () {
          alert("Please allow location access");
        }
      );
    });

    // Submit button
    document.getElementById("submitBtn").addEventListener("click", async function () {
      const photo = document.getElementById("photo").files[0];
      const notes = document.getElementById("notes").value;
      const status = document.getElementById("statusText");

      if (!photo) {
        alert("Please take or choose a photo first");
        return;
      }
      if (latitude === null) {
        alert("Please click 'Get my location' first");
        return;
      }

      const formData = new FormData();
      formData.append("photo", photo);
      formData.append("notes", notes);
      formData.append("latitude", latitude);
      formData.append("longitude", longitude);

      status.textContent = "Sending...";

      try {
        const response = await fetch("/report", {
          method: "POST",
          body: formData
        });
        const data = await response.json();
        status.textContent = data.message;
      } catch (error) {
        status.textContent = "Something went wrong. Please try again.";
      }
    });
  </script>

</body>
</html>
